services:
  - type: web
    name: aicte-fdr-portal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    disk:
      name: fdr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: portaladmin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /var/data/fdr.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
